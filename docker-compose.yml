services:
    postgres:
        image: postgres:17-alpine
        container_name: station-parfume-db
        environment:
            POSTGRES_USER: ${DB_USER:?isi DB_USER di .env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
            POSTGRES_DB: ${DB_NAME:?isi DB_NAME di .env}
        ports:
            - "${DB_PORT:-5433}:5432"
        volumes: 
            - sp_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
        
    redis:
        image: redis:7-alpine
        container_name: station-parfume-redis
        ports:
            - "6380:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    sp_postgres_data:
