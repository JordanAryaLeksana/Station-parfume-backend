              schema:
                $ref: '#/components/schemas/StockLevelListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/inventory/movements:
    get:
      tags:
      - Admin Stok
      summary: Riwayat stok
      operationId: get_api_v1_admin_inventory_movements
      description: '**Peran:** owner, admin, warehouse.'
      security:
      - bearerAuth: []
      parameters:
      - name: variant_id
        in: query
        required: false
        description: Filter satu varian
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Maks baris (default 100, maks 500)
        schema:
          type: integer
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/products:
