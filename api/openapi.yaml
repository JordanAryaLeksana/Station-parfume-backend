          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/products/{id}/sizes:
    put:
      tags:
      - Admin Katalog
      summary: Atur ukuran khusus produk
      operationId: put_api_v1_admin_products_id_sizes
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSizesInput'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/products/{id}/variants:
    post:
      tags:
      - Admin Katalog
      summary: Tambah varian produk umum
      operationId: post_api_v1_admin_products_id_variants
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralVariantInput'
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/products/{id}/variants/generate:
    post:
      tags:
      - Admin Katalog
      summary: Buat kombinasi varian yang belum ada
      operationId: post_api_v1_admin_products_id_variants_generate
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCountEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/scents/{id}:
    patch:
      tags:
      - Admin Katalog
      summary: Ubah wangian (nama, tarif, aktif)
      operationId: patch_api_v1_admin_scents_id
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScentPatch'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/sizes:
    get:
      tags:
      - Admin Katalog
      summary: Daftar semua ukuran
      operationId: get_api_v1_admin_sizes
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SizeListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
      - Admin Katalog
      summary: Tambah ukuran
      operationId: post_api_v1_admin_sizes
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeInput'
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SizeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/sizes/{id}:
    patch:
      tags:
      - Admin Katalog
      summary: Ubah ukuran
      operationId: patch_api_v1_admin_sizes_id
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizePatch'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SizeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/variants:
    patch:
      tags:
      - Admin Katalog
      summary: Ubah harga khusus / aktif banyak varian sekaligus
      operationId: patch_api_v1_admin_variants
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantPatchList'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedCountEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/auth/google:
    get:
      tags:
      - Auth
      summary: Mulai login Google (redirect ke Google)
      operationId: get_api_v1_auth_google
      description: Buka di browser (bukan fetch). Setelah login, Google kembali ke /auth/google/callback.
      security: []
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
        '307':
          description: Redirect ke halaman login Google; cookie `oauth_state` dipasang
          headers:
            Location:
              schema:
                type: string
  /api/v1/auth/google/callback:
    get:
      tags:
      - Auth
      summary: Callback Google (redirect ke frontend)
      operationId: get_api_v1_auth_google_callback
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: Dari Google
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Harus sama dengan cookie oauth_state
        schema:
          type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
        '303':
          description: Redirect ke `FRONTEND_URL/oauth-success#access_token=…&refresh_token=…` atau `#error=<kode>` (access_denied,
            google_failed, email_unverified, email_registered, server_error)
          headers:
            Location:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login pembeli (email & password)
      operationId: post_api_v1_auth_login
      description: Semua kegagalan login dijawab 401 "Email atau password salah". Rate limit 10/menit per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/auth/login/admin:
    post:
      tags:
      - Auth
      summary: Login staf (owner/admin/warehouse/cs)
      operationId: post_api_v1_auth_login_admin
      description: Akun pembeli ditolak dengan 401 yang sama. Rate limit 10/menit per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 'Logout: cabut access token (+ refresh token di body)'
      operationId: post_api_v1_auth_logout
      description: 'Header Authorization = access token. Body opsional `{"refresh_token": "..."}` supaya refresh token ikut
        dicabut.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Berhasil, tanpa body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Tukar refresh token dengan pasangan token baru
      operationId: post_api_v1_auth_refresh
      description: Header Authorization = **refresh token** (bukan access token). Refresh token hanya bisa dipakai sekali;
        simpan yang baru. Rate limit 30/menit per IP.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
