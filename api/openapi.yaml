  /api/v1/admin/products/{id}/rates:
    patch:
      tags:
      - Admin Katalog
      summary: Ubah tarif per ml semua wangian produk
      operationId: patch_api_v1_admin_products_id_rates
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
