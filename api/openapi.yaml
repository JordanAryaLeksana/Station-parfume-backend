components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token tidak ada / tidak valid / sudah dicabut
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Peran tidak diizinkan, atau origin tidak diizinkan (CORS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Bentrok dengan data yang ada (mis. email/kode sudah dipakai)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Terlalu banyak percobaan; lihat header Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Detik
    BadGateway:
      description: Gateway pembayaran bermasalah
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Layanan (Redis/pembayaran) sedang tidak tersedia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DefaultError:
      description: Error lain (413 body terlalu besar, 405, 500, …)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        variant_id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 999
      required:
      - variant_id
      - quantity
    AdminProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/Category'
        kind:
          type: string
          enum:
          - perfume
          - general
        code:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        grade:
          type: string
          enum:
          - regular
          - exclusive
        inspired_by:
          type: string
        note_primary:
          type: string
        note_secondary:
          type: string
        weight_gram:
          type: integer
        track_stock:
          type: boolean
          description: false = selalu tersedia (parfum diracik)
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/Size'
        scents:
          type: array
          items:
            $ref: '#/components/schemas/Scent'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AdminVariant'
      required:
      - id
      - category_id
      - kind
      - code
      - name
      - slug
      - description
      - weight_gram
      - track_stock
      - status
      - sort_order
      - created_at
      - updated_at
      - variants
      additionalProperties: false
    AdminProductEnvelope:
      type: object
      properties:
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/AdminProduct'
      required:
      - message
      - data
      additionalProperties: false
    AdminVariant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/Product'
        scent_id:
          type: integer
          format: int64
        scent:
          $ref: '#/components/schemas/Scent'
        size_id:
          type: integer
          format: int64
        size:
          $ref: '#/components/schemas/Size'
        concentration:
          type: string
          enum:
          - murni
          - campur
        label:
          type: string
        code:
          type: string
        price:
          type: integer
          format: int64
          description: 'Parfum: harga khusus (null = rumus). Produk umum: harga jual'
          nullable: true
        compare_at_price:
          type: integer
          format: int64
        weight_gram:
          type: integer
        stock:
          type: integer
          description: Stok fisik (produk track_stock)
        reserved:
          type: integer
          description: Tertahan order belum bayar
        is_active:
          type: boolean
        sort_order:
          type: integer
