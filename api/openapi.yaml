# Spesifikasi OpenAPI Station Parfume API — disajikan di /docs (Swagger UI).
# Diedit langsung. Test memastikan setiap rute Gin ada di sini (src/routes) dan
# setiap response di test integrasi cocok dengan skema di sini.
openapi: 3.0.3
info:
  title: Station Parfume API
  version: 1.0.0
  description: |-
    API backend toko parfum Station Parfume.

    **Format response.** Sukses: `{"message": "...", "data": ...}`. Error: `{"error": "Bad Request", "message": "...", "status": 400}`.

    **Auth.** Login → `access_token` (15 menit) dikirim di header `Authorization: Bearer <token>`. Saat 401, panggil `POST /api/v1/auth/refresh` dengan **refresh token** di header yang sama; refresh token hanya bisa dipakai sekali.

    **Uang** dalam rupiah utuh (integer). **Waktu** RFC 3339.

    **CORS.** Domain frontend harus terdaftar di env `CORS_ALLOWED_ORIGINS`. Path boleh dengan atau tanpa garis miring di akhir.
servers:
- url: /
  description: Server ini
tags:
- name: Auth
- name: Katalog
- name: Keranjang
- name: Pesanan
- name: Pembayaran
- name: Users
- name: Admin Katalog
- name: Admin Stok
- name: Umum
- name: Health
paths:
  /api/v1:
    get:
      tags:
      - Umum
      summary: Sapaan API
      operationId: get_api_v1
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/images/{id}:
    patch:
      tags:
      - Admin Katalog
      summary: Ubah foto
      operationId: patch_api_v1_admin_images_id
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagePatch'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      tags:
      - Admin Katalog
      summary: Hapus foto
      operationId: delete_api_v1_admin_images_id
      description: '**Peran:** owner, admin.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /api/v1/admin/inventory/adjustments:
    post:
      tags:
      - Admin Stok
      summary: Sesuaikan stok (banyak sekaligus)
      operationId: post_api_v1_admin_inventory_adjustments
      description: |-
        Semua atau tidak sama sekali. Setiap perubahan dicatat di riwayat stok.

        **Peran:** owner, admin, warehouse.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
