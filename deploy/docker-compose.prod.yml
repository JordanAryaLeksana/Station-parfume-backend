# Production di satu VPS: Caddy (HTTPS otomatis) → api → Postgres + Redis.
# Panduan lengkap: docs/deploy-vps.md. Env: deploy/.env.prod.
#   deploy/update.sh               # deploy pertama & setiap update (backup → build → migrasi → api)
#   deploy/compose.sh ps|logs|...  # perintah docker compose lain
# Hanya Caddy yang membuka port ke internet; api, db, redis hanya di jaringan
# internal. migrate jalan sekali setiap deploy; api baru start setelah migrasi sukses.
name: station-parfume

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# api & migrate: image yang sama (dibangun dari Dockerfile di root repo),
# filesystem read-only, tanpa capability Linux, tidak bisa menaikkan hak akses.
x-api-image: &api-image
  image: station-parfume-api:latest
  build:
    context: ..
    dockerfile: Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?isi DB_USER di .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env.prod}
      POSTGRES_DB: ${DB_NAME:?isi DB_NAME di .env.prod}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?isi REDIS_PASSWORD di .env.prod}
    # AOF: blacklist token (logout) & rate limit tetap ada setelah restart.
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  migrate:
    <<: *api-image
    entrypoint: ["/app/bin/migrate"]
    command: ["up"]
    env_file: ${ENV_FILE:-.env.prod}
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  api:
    <<: *api-image
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.prod}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["8080"]
    stop_grace_period: 20s # graceful shutdown server maks 10 dtk + job
    networks: [internal]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?isi API_DOMAIN di .env.prod}
    # Hanya IPv4: lewat IPv6 Docker meneruskan koneksi via proxy-nya sendiri,
    # sehingga semua pengunjung IPv6 terlihat ber-IP sama (172.30.10.1) dan
    # berbagi batas rate limit. Jadi DNS cukup record A (lihat runbook).
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
      - "0.0.0.0:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
    networks: [internal]
    logging: *logging

networks:
  internal:
    # Subnet tetap supaya TRUSTED_PROXIES bisa diisi tepat (IP pembeli asli
    # terbaca dari X-Forwarded-For yang dipasang Caddy → rate limit benar).
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
